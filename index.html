<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Testy KPP</title><style>:root{--bg:#fff;--fg:#1c1c1e;--mut:#6b6b70;--line:#e3e3e8;--acc:#0a5cff;--code:#f4f4f7}
@media(prefers-color-scheme:dark){:root{--bg:#121214;--fg:#ececf0;--mut:#9a9aa3;--line:#2b2b31;--acc:#6ea0ff;--code:#1d1d21}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,system-ui,Segoe UI,sans-serif}
main{max-width:820px;margin:0 auto;padding:24px 16px 64px}nav{font-size:14px;margin-bottom:16px}
a{color:var(--acc)}h1,h2,h3{line-height:1.25}h2{margin-top:2em;border-bottom:1px solid var(--line);padding-bottom:.2em}
table{border-collapse:collapse;display:block;overflow-x:auto}td,th{border:1px solid var(--line);padding:6px 10px;text-align:left}
code{background:var(--code);padding:1px 5px;border-radius:4px;font-size:.9em}pre{background:var(--code);padding:12px;overflow-x:auto;border-radius:8px}pre code{padding:0;background:none}
blockquote{border-left:3px solid var(--line);margin:0;padding-left:12px;color:var(--mut)}</style></head><body><main><h1>Testy KPP — dokumentacja</h1><ul><li><a href="polityka-prywatnosci.html">Polityka prywatności — „Testy KPP”</a></li><li><a href="ux-architektura.html">Architektura UX/UI — aplikacja „Testy KPP”</a></li></ul></main></body></html>
